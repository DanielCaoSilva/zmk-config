# This file generates the GitHub Actions matrix used by
# zmkfirmware/zmk/.github/workflows/build-user-config.yml.
#
# Keep every keymap in this repository represented here so
# CI validates all firmware variants on every push/PR.
---
include:
  # Recovery utility
  - board: nice_nano_v2
    shield: settings_reset

  # Lily58 (split)
  - board: nice_nano_v2
    shield: lily58_left nice_view_adapter nice_view
  - board: nice_nano_v2
    shield: lily58_right nice_view_adapter nice_view

  # Sofle v2.1 (split)
  - board: nice_nano_v2
    shield: sofle_left nice_view_adapter nice_view
  - board: nice_nano_v2
    shield: sofle_right nice_view_adapter nice_view

  # Nibble65
  - board: nice_nano_v2
    shield: nibble

  # Hillside46 (split)
  - board: nice_nano_v2
    shield: hillside46_left
  - board: nice_nano_v2
    shield: hillside46_right

  # Hillside48 (split)
  - board: nice_nano_v2
    shield: hillside48_left
  - board: nice_nano_v2
    shield: hillside48_right

  # Hillside52 (split)
  - board: nice_nano_v2
    shield: hillside52_left
  - board: nice_nano_v2
    shield: hillside52_right

  # Fliporb (single)
  - board: nice_nano_v2
    shield: fliporb
  - board: seeeduino_xiao_ble
    shield: fliporb

  # Tulip29
  - board: nice_nano_v2
    shield: tulip29
